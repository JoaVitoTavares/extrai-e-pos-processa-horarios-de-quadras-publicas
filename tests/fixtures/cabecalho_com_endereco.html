  </div>

       style="order: 3; min-height: 50px; height: max-content; font-size: 15px; text-align: center;">

  </div>
  <div class="bubble-element Text baTaVaSaR clickable-element bubble-r-vertical-center"

  <div class="bubble-element Text baTaRaAaK clickable-element bubble-r-vertical-center"
